name: BTC 15m 缠论买卖点推送

on:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      test:
        description: "只发一条测试通知，不跑分析"
        type: boolean
        default: false

concurrency:
  group: chan15-push
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 恢复推送记录（避免重复通知）
        uses: actions/cache@v4
        with:
          path: state.json
          key: "chan-state-${{ github.run_id }}"
          restore-keys: |
            chan-state-

      - name: 拉行情并检查买卖点
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: |
          if [ "${{ inputs.test }}" = "true" ]; then
            echo "== 测试模式：只验证推送通道 =="
            python chan15_push.py --test
          else
            python chan15_push.py
          fi

      - name: 显示运行日志
        if: always()
        run: |
          echo "--- state.json ---"
          cat state.json 2>/dev/null || echo "(尚无记录)"
          echo "--- push.log (末 30 行) ---"
          tail -n 30 push.log 2>/dev/null || echo "(无日志)"
